# XcodeGen spec for the native iOS app: the .xcodeproj is generated (and git-ignored) so project files never conflict between machines.
#   brew install xcodegen && cd ios && xcodegen generate && open Auralis.xcodeproj
# Sources: ios/Sources (this app's entry point and shell) + shared/apple/AuralisUI (SwiftUI shared with the macOS app).
# The AuralisKit Swift package (shared/apple/AuralisKit) is a dependency, not copied code.
name: Auralis
options:
  bundleIdPrefix: app.auralis
  deploymentTarget:
    iOS: "26.0"
packages:
  AuralisKit:
    path: ../shared/apple/AuralisKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Free Apple Account: pick your Personal Team in Xcode (Signing & Capabilities). A paid team ID goes here later.
    DEVELOPMENT_TEAM: ""
targets:
  AuralisiOS:
    type: application
    platform: iOS
    sources: [Sources, ../shared/apple/AuralisUI]
    dependencies:
      - package: AuralisKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.auralis.player
        PRODUCT_NAME: Auralis
        TARGETED_DEVICE_FAMILY: "1,2"
        # Assets.xcassets only holds the shared line icons; there is no app icon set yet.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Auralis
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Self-hosted servers are often plain http on the LAN (http://nas.local:4533). Tighten once everything is behind https.
        NSAppTransportSecurity: { NSAllowsArbitraryLoads: true }
