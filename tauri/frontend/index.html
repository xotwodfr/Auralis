<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Auralis</title>
    <script>
      // Apply the saved theme before first paint (mirrors shared/ui/src/app/theme.ts).
      try {
        var t = localStorage.getItem('auralis-theme')
        var presets = ['light', 'dark', 'midnight', 'oled', 'nord', 'sunset', 'sakura', 'forest', 'artwork']
        document.documentElement.dataset.theme =
          presets.indexOf(t) >= 0 ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
