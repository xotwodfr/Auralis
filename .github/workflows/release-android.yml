name: Release (Android)
# Pushing a tag like v0.1.0 builds a signed arm64 APK and attaches it to the GitHub release.
# Run manually with a tag name to (re)build the APK for an existing release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach the APK to
        required: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - run: npm ci
      # android/gen/android is committed (with usesCleartextTraffic on: self-hosted music servers are often plain http on the
      # LAN, and release builds would otherwise disable it), so there is no `android init` step.
      - name: Build APK
        working-directory: android
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --apk --target aarch64 --ci
      # An unsigned APK cannot be installed. Every release must share one signature so updates install over older builds, so
      # the job fails without the ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD secrets instead of publishing a throwaway key.
      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(find android/gen/android -name '*-unsigned.apk' | head -1)"
          [ -n "$UNSIGNED" ] || { echo "no unsigned apk found"; exit 1; }
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD are not set; refusing to sign a release with a throwaway key"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > ks.jks
          export PASS="$KEYSTORE_PASSWORD"
          mkdir out
          OUT="out/Auralis-${TAG#v}-android-arm64.apk"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-pass env:PASS --key-pass env:PASS --out "$OUT" aligned.apk
          "$BT/apksigner" verify "$OUT"
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: Auralis-android
          path: out/*.apk
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            && gh release upload "$TAG" out/*.apk --clobber \
            || gh release create "$TAG" out/*.apk --prerelease --verify-tag --title "Auralis ${TAG#v}" \
                 --notes "Android arm64 APK (sideload). Your music server must allow CORS for the origin http://tauri.localhost."
