name: CI
on:
  push:
  pull_request:

jobs:
  # shared/ui, server, web and the frontends of tauri and android: everything that is TypeScript.
  web:
    runs-on: ubuntu-latest
    # A real PostgreSQL for the chat e2e (web/e2e/chat.spec.ts starts server/chat against it).
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: e2e, POSTGRES_PASSWORD: e2e, POSTGRES_DB: chat_e2e }
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U e2e -d chat_e2e" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:web
      - run: npm run build -w @auralis/tauri
      - run: npm run build -w @auralis/android
      - run: npx playwright install --with-deps chromium
      - run: npm ci --prefix server/chat
      - run: npm run test:e2e
        env: { E2E_CHAT_DATABASE_URL: 'postgres://e2e:e2e@127.0.0.1:5432/chat_e2e' }

  # The self-hosted chat server (server/chat): its own lockfile, real-PostgreSQL tests (Testcontainers), and the Docker
  # image + Compose stack with the persistence smoke check (CHAT.md §8.3, §13).
  chat-server:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: server/chat }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/chat/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Secret scan
        # Tokens look like ac1_ + 43 base64url characters; private keys and filled-in passwords must never be committed.
        run: |
          ! git grep -nE 'ac1_[A-Za-z0-9_-]{43}|BEGIN [A-Z ]*PRIVATE KEY' -- . ':!tests' && test -z "$(git ls-files secrets .env)"
      - name: Docker smoke (health, persistence across down/up and --force-recreate)
        run: |
          install -d -m 700 secrets && openssl rand -base64 32 > secrets/db_password && chmod 600 secrets/db_password
          # The image runs as node (uid 1000); the runner user is not, and Compose file secrets keep the host owner.
          sudo chown 1000 secrets/db_password
          cp .env.example .env
          docker compose build
          ./scripts/smoke.sh
      - if: always()
        run: docker compose down -v || true

  tauri-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libxdo-dev libssl-dev
      - run: npm ci && npm run build -w @auralis/tauri
      - run: cargo check --manifest-path tauri/Cargo.toml
      - run: cargo check --manifest-path android/Cargo.toml

  macos:
    # Needs an image with Xcode 26 (iOS/macOS 26 SDKs). If this job fails to start, the runner label is the first thing to check.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - run: brew install xcodegen
      - name: Test AuralisKit
        working-directory: shared/apple/AuralisKit
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log || { grep -E ": error: " test.log | sort -u | head -40 | sed 's/^/::error::/'; exit 1; }
      - run: xcodegen generate
        working-directory: macos
      - name: Build macOS app
        working-directory: macos
        # Compiler errors become annotations: they are readable on the run page without downloading logs.
        run: |
          set -o pipefail
          xcodebuild build -project Auralis.xcodeproj -scheme AuralisMac -destination 'generic/platform=macOS' -derivedDataPath build/mac CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-mac.log || { grep -E ": error: " build-mac.log | sort -u | head -40 | sed 's/^/::error::/'; exit 1; }
      - name: Package macOS app
        working-directory: macos
        run: |
          APP=$(find build/mac/Build/Products -maxdepth 2 -name 'Auralis.app' -print -quit)
          test -n "$APP" || { echo "Auralis.app not found"; exit 1; }
          ARCHS_FOUND=$(lipo -archs "$APP/Contents/MacOS/Auralis")
          echo "Executable architectures: $ARCHS_FOUND"
          lipo -info "$APP/Contents/MacOS/Auralis"
          file "$APP/Contents/MacOS/Auralis"
          case " $ARCHS_FOUND " in *" x86_64 "*) ;; *) echo "x86_64 slice missing"; exit 1;; esac
          case " $ARCHS_FOUND " in *" arm64 "*) ;; *) echo "arm64 slice missing"; exit 1;; esac
          ditto -c -k --sequesterRsrc --keepParent "$APP" Auralis-macOS-unsigned.zip
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: Auralis-macOS-unsigned
          path: macos/Auralis-macOS-unsigned.zip
          if-no-files-found: error

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - name: Build iOS app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project Auralis.xcodeproj -scheme AuralisiOS -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-ios.log || { grep -E ": error: " build-ios.log | sort -u | head -40 | sed 's/^/::error::/'; exit 1; }
