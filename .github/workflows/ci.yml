name: CI
on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  tauri-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libxdo-dev libssl-dev
      - run: npm ci && npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  apple:
    # Needs an image with Xcode 26 (iOS/macOS 26 SDKs). If this job fails to start, the runner label is the first thing to check.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: brew install xcodegen
      - run: swift test
        working-directory: apple/AuralisKit
      - run: xcodegen generate
        working-directory: apple
      - name: Build macOS app
        working-directory: apple
        run: xcodebuild build -project Auralis.xcodeproj -scheme AuralisMac -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
      - name: Build iOS app
        working-directory: apple
        run: xcodebuild build -project Auralis.xcodeproj -scheme AuralisiOS -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
